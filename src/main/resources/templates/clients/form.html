<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Client Form</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/animals-ui.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header('clients')}"></nav>
<main class="page-shell">
    <section class="form-card">
        <div class="form-header">
            <div><h1 class="page-title page-title-small" th:text="${client.id == null ? 'New Client' : 'Edit Client'}">Client</h1></div>
        </div>
        <p class="form-intro">Store owner contact details here so patient assignment, reminders, and follow-up care all have a reliable contact base.</p>
        <form method="post" th:action="${formAction}" th:object="${client}">
            <input th:field="*{id}" type="hidden">
            <div class="field-stack">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" minlength="3" placeholder="Ex: Ana Popescu" required th:field="*{name}" type="text">
                    <span class="error-text" th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></span>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" minlength="10" pattern="[0-9+ ]{10,15}" placeholder="Ex: 07xx xxx xxx" required th:field="*{phone}" type="text">
                    <span class="error-text" th:errors="*{phone}" th:if="${#fields.hasErrors('phone')}"></span>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" placeholder="client@example.com" th:field="*{email}" type="email">
                    <span class="helper-text">Email is optional, but it helps for reminders and confirmations.</span>
                    <span class="error-text" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
                </div>
            </div>
            <div class="form-actions" style="margin-top: 28px;">
                <button class="btn btn-primary" th:text="${client.id == null ? 'Save Client' : 'Update Client'}" type="submit">Save Client</button>
                <a class="btn btn-secondary" th:href="@{/clients}">Back</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
