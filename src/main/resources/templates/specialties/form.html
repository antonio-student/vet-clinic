<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Specialty Form</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/animals-ui.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header('specialties')}"></nav>
<main class="page-shell">
    <section class="form-card">
        <div class="form-header">
            <div><h1 class="page-title page-title-small" th:text="${specialty.id == null ? 'New Specialty' : 'Edit Specialty'}">Specialty</h1></div>
        </div>
        <p class="form-intro">This page remains available for direct cleanup, but most specialty creation now happens inside the doctor form.</p>
        <form method="post" th:action="${formAction}" th:object="${specialty}">
            <input th:field="*{id}" type="hidden">
            <div class="field-stack">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" placeholder="Ex: Dermatology" th:field="*{name}" type="text">
                    <span class="error-text" th:errors="*{name}" th:if="${#fields.hasErrors('name')}"></span>
                </div>
            </div>
            <div class="form-actions" style="margin-top: 28px;">
                <button class="btn btn-primary" th:text="${specialty.id == null ? 'Save Specialty' : 'Update Specialty'}" type="submit">Save Specialty</button>
                <a class="btn btn-secondary" th:href="@{/specialties}">Back</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
