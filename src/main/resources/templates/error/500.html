<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>500 - Server Error</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/animals-ui.css}">
</head>
<body>
<nav th:replace="~{fragments/layout :: header('error')}"></nav>
<main class="page-shell">
    <section class="form-card">
        <div class="form-header">
            <div><h1 class="page-title page-title-small" th:text="${errorTitle ?: 'Unexpected server error'}">Unexpected server error</h1></div>
        </div>
        <p class="form-intro" th:text="${errorMessage ?: 'Something went wrong while processing your request. Please try again.'}">
            Something went wrong while processing your request. Please try again.
        </p>
        <div class="field-stack">
            <div class="field">
                <label>Request path</label>
                <div class="helper-text" th:text="${requestPath ?: 'Unknown path'}">/appointments/delete/1</div>
            </div>
        </div>
        <div class="form-actions" style="margin-top: 28px;">
            <a class="btn btn-primary" th:href="@{/}">Back to Dashboard</a>
            <a class="btn btn-secondary" href="javascript:history.back()">Go Back</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
